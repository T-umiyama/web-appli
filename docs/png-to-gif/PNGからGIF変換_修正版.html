<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNGからGIFを作成</title>
<style>
:root{--blue:#2563eb;--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#cbd5e1}
*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic",YuGothic,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1120px;margin:auto;padding:32px 20px}header{margin-bottom:24px}header small{color:var(--blue);font-weight:700}h1{margin:5px 0 6px;font-size:34px}header p{margin:0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:24px}.col{display:grid;gap:24px;align-content:start}.card{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 2px 10px #0f172a0d}
.drop{width:100%;min-height:170px;border:2px dashed var(--border);border-radius:16px;background:#f8fafc;display:grid;place-content:center;text-align:center;cursor:pointer;transition:.2s}.drop:hover,.drop.over{border-color:#60a5fa;background:#eff6ff}.drop strong{font-size:16px}.drop span{color:var(--muted);font-size:12px;margin-top:4px}.drop-icon{font-size:38px;color:var(--blue);line-height:1;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:18px;font-weight:700}.note{color:var(--muted);font-size:12px;margin-top:3px}.badge{background:#f1f5f9;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-height:430px;overflow:auto;margin-top:16px}.frame{position:relative;border:1px solid #e2e8f0;border-radius:12px;padding:8px;background:#fff;cursor:grab}.frame.active{border-color:var(--blue);box-shadow:0 0 0 2px #dbeafe}.frame img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px;background-color:#fff;background-image:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}.num{position:absolute;top:12px;left:12px;background:#0f172acc;color:white;border-radius:999px;font-size:11px;font-weight:700;padding:4px 7px}.fname{display:flex;align-items:center;gap:4px;margin-top:7px}.fname span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.iconbtn{border:0;background:transparent;color:#94a3b8;cursor:pointer;font-size:17px}.iconbtn:hover{color:#dc2626}.empty{min-height:150px;margin-top:15px;border-radius:12px;background:#f8fafc;display:grid;place-content:center;text-align:center;color:#94a3b8;font-size:13px}
.preview{aspect-ratio:1;border-radius:16px;overflow:hidden;display:grid;place-items:center;margin-top:16px;background-color:#fff;background-image:linear-gradient(45deg,#e5e7eb 25%,transparent 25%),linear-gradient(-45deg,#e5e7eb 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e5e7eb 75%),linear-gradient(-45deg,transparent 75%,#e5e7eb 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.preview img{width:100%;height:100%;object-fit:contain}.preview-text{font-size:13px;color:#94a3b8}.counter{text-align:center;color:var(--muted);font-size:12px;margin:10px 0 0}
button{font:inherit}.btn{border:1px solid #dbe2ea;background:#fff;border-radius:11px;padding:8px 13px;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.primary{width:100%;border:0;background:var(--blue);color:#fff;font-weight:700;font-size:15px;padding:14px;border-radius:12px;cursor:pointer}.primary:hover{background:#1d4ed8}.primary:disabled{opacity:.45;cursor:not-allowed}
.settings{display:grid;gap:20px;margin-top:18px}label{display:block;font-size:14px;font-weight:600}.labelrow{display:flex;justify-content:space-between;margin-bottom:9px}input[type=range]{width:100%;accent-color:var(--blue)}.number{display:flex;border:1px solid #e2e8f0;border-radius:11px;padding:0 11px;margin-top:8px}.number input{width:100%;border:0;outline:0;padding:11px 0;font:inherit}.number span{align-self:center;color:var(--muted);font-size:13px}.switch{display:flex;justify-content:space-between;align-items:center;background:#f8fafc;padding:12px 14px;border-radius:11px}.switch input{width:19px;height:19px;accent-color:var(--blue)}.status{text-align:center;font-size:13px;color:var(--muted);min-height:20px;margin-top:11px}.error{color:#dc2626}
@media(max-width:800px){.grid{grid-template-columns:1fr}.frames{grid-template-columns:repeat(2,1fr)}h1{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
<header><small>画像変換ツール</small><h1>PNGからGIFを作成</h1><p>PNGを並べ、速度とサイズを決めてGIFとして保存できます。</p></header>
<div class="grid">
<div class="col">
<section class="card"><div id="drop" class="drop"><div class="drop-icon">⇧</div><strong>PNGを選択またはドロップ</strong><span>複数選択できます</span></div><input id="file" type="file" accept="image/png" multiple hidden></section>
<section class="card"><div class="row"><div><div class="title">フレーム</div><div class="note">ドラッグして再生順を変更できます</div></div><div class="row"><button id="clear" class="btn" hidden>すべて削除</button><span id="count" class="badge">0枚</span></div></div><div id="frames" class="frames" hidden></div><div id="empty" class="empty">画像を追加するとここに表示されます</div></section>
</div>
<div class="col">
<section class="card"><div class="row"><div class="title">プレビュー</div><button id="play" class="btn" disabled>停止</button></div><div id="preview" class="preview"><span class="preview-text">プレビューはここに表示されます</span></div><p id="counter" class="counter"></p></section>
<section class="card"><div class="title">出力設定</div><div class="note" style="margin-top:6px">出力サイズは最初のPNGと同じです。縦横比もそのまま保持します。</div><div class="settings">
<label><span class="labelrow"><span>切り替え間隔</span><span id="delayText">500 ms</span></span><input id="delay" type="range" min="50" max="3000" step="50" value="500"></label>
<label class="switch"><span><b>繰り返し再生</b><small class="note" style="display:block">無限ループで再生します</small></span><input id="loop" type="checkbox" checked></label>
<button id="convert" class="primary" disabled>GIFを作成して保存</button></div><div id="status" class="status"></div></section>
</div></div></div>
<script>
const $=s=>document.querySelector(s); const frames=[]; let current=0,playing=true,timer=null,dragIndex=null;
const els={drop:$('#drop'),file:$('#file'),frames:$('#frames'),empty:$('#empty'),count:$('#count'),clear:$('#clear'),preview:$('#preview'),play:$('#play'),counter:$('#counter'),delay:$('#delay'),delayText:$('#delayText'),loop:$('#loop'),convert:$('#convert'),status:$('#status')};
function status(text,error=false){els.status.textContent=text;els.status.className='status'+(error?' error':'')}
function addFiles(list){const pngs=[...list].filter(f=>f.type==='image/png'||f.name.toLowerCase().endsWith('.png'));if(!pngs.length)return status('PNG画像を選択してください。',true);pngs.forEach(file=>frames.push({file,name:file.name,url:URL.createObjectURL(file)}));status('');render();restart()}
function render(){els.count.textContent=frames.length+'枚';els.empty.hidden=frames.length>0;els.frames.hidden=!frames.length;els.clear.hidden=!frames.length;els.play.disabled=!frames.length;els.convert.disabled=frames.length<2;els.frames.innerHTML='';frames.forEach((f,i)=>{const div=document.createElement('div');div.className='frame'+(i===current?' active':'');div.draggable=true;div.innerHTML=`<span class="num">${i+1}</span><img src="${f.url}" alt=""><div class="fname"><span title="${f.name.replaceAll('"','&quot;')}">${f.name}</span><button class="iconbtn" title="削除">×</button></div>`;div.addEventListener('dragstart',()=>dragIndex=i);div.addEventListener('dragover',e=>e.preventDefault());div.addEventListener('drop',()=>{if(dragIndex!==null&&dragIndex!==i){const [x]=frames.splice(dragIndex,1);frames.splice(i,0,x);current=0;render();restart()}dragIndex=null});div.querySelector('.iconbtn').onclick=()=>{URL.revokeObjectURL(frames[i].url);frames.splice(i,1);if(current>=frames.length)current=Math.max(0,frames.length-1);render();restart()};els.frames.appendChild(div)});showCurrent()}
function showCurrent(){if(!frames.length){els.preview.innerHTML='<span class="preview-text">プレビューはここに表示されます</span>';els.counter.textContent='';return}els.preview.innerHTML=`<img src="${frames[current].url}" alt="GIFプレビュー">`;els.counter.textContent=`${current+1} / ${frames.length}　合計約${(frames.length*Number(els.delay.value)/1000).toFixed(1)}秒`;[...els.frames.children].forEach((x,i)=>x.classList.toggle('active',i===current))}
function restart(){clearInterval(timer);if(playing&&frames.length>1)timer=setInterval(()=>{current=(current+1)%frames.length;showCurrent()},Math.max(50,Number(els.delay.value)||500));showCurrent()}
els.drop.onclick=()=>els.file.click();els.file.onchange=e=>{addFiles(e.target.files);e.target.value=''};['dragenter','dragover'].forEach(t=>els.drop.addEventListener(t,e=>{e.preventDefault();els.drop.classList.add('over')}));['dragleave','drop'].forEach(t=>els.drop.addEventListener(t,e=>{e.preventDefault();els.drop.classList.remove('over')}));els.drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
els.clear.onclick=()=>{frames.forEach(f=>URL.revokeObjectURL(f.url));frames.length=0;current=0;status('');render();restart()};els.play.onclick=()=>{playing=!playing;els.play.textContent=playing?'停止':'再生';restart()};els.delay.oninput=()=>{els.delayText.textContent=els.delay.value+' ms';restart()};
const load=url=>new Promise((ok,ng)=>{const i=new Image;i.onload=()=>ok(i);i.onerror=ng;i.src=url});
function u16(a,n){a.push(n&255,(n>>8)&255)}
function palette332(){const a=[];for(let i=0;i<256;i++){a.push(Math.round(((i>>5)&7)*255/7),Math.round(((i>>2)&7)*255/7),Math.round((i&3)*255/3))}return a}
function index332(rgba){const out=new Uint8Array(rgba.length/4);for(let i=0,j=0;i<rgba.length;i+=4,j++){const r=rgba[i],g=rgba[i+1],b=rgba[i+2];out[j]=((r>>5)<<5)|((g>>5)<<2)|(b>>6)}return out}
function lzw(data){
  // A deliberately simple GIF LZW stream. Frequent clear codes keep the
  // code width fixed at 9 bits, which avoids decoder compatibility issues.
  const clear=256,end=257,out=[];let bits=0,bitCount=0,sinceClear=0;
  const emit=code=>{bits|=code<<bitCount;bitCount+=9;while(bitCount>=8){out.push(bits&255);bits>>>=8;bitCount-=8}};
  emit(clear);
  for(let i=0;i<data.length;i++){
    emit(data[i]);sinceClear++;
    if(sinceClear>=200&&i<data.length-1){emit(clear);sinceClear=0}
  }
  emit(end);if(bitCount>0)out.push(bits&255);return out
}
function blocks(a,bytes){for(let i=0;i<bytes.length;i+=255){const n=Math.min(255,bytes.length-i);a.push(n,...bytes.slice(i,i+n))}a.push(0)}
function makeGif(frameData,w,h,delayMs,repeat){const a=[71,73,70,56,57,97];u16(a,w);u16(a,h);a.push(247,0,0,...palette332());if(repeat){a.push(33,255,11,...[...new TextEncoder().encode('NETSCAPE2.0')],3,1,0,0,0)}for(const pixels of frameData){a.push(33,249,4,4);u16(a,Math.max(1,Math.round(delayMs/10)));a.push(0,0,44);u16(a,0);u16(a,0);u16(a,w);u16(a,h);a.push(0,8);blocks(a,lzw(pixels))}a.push(59);return new Uint8Array(a)}
els.convert.onclick=async()=>{if(frames.length<2)return status('GIF作成にはPNG画像が2枚以上必要です。',true);els.convert.disabled=true;els.convert.textContent='作成中…';status('GIFを作成しています…');try{const images=await Promise.all(frames.map(f=>load(f.url)));const w=images[0].naturalWidth;const h=images[0].naturalHeight;const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d',{willReadFrequently:true}),all=[];for(const img of images){ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);const s=Math.min(w/img.naturalWidth,h/img.naturalHeight),dw=Math.round(img.naturalWidth*s),dh=Math.round(img.naturalHeight*s),dx=Math.round((w-dw)/2),dy=Math.round((h-dh)/2);ctx.drawImage(img,dx,dy,dw,dh);all.push(index332(ctx.getImageData(0,0,w,h).data))}const bytes=makeGif(all,w,h,Math.max(50,Number(els.delay.value)||500),els.loop.checked),blob=new Blob([bytes],{type:'image/gif'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='animation.gif';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);status('GIFをダウンロードしました。')}catch(e){console.error(e);status('GIFを作成できませんでした。PNG画像を確認して、もう一度お試しください。',true)}finally{els.convert.disabled=frames.length<2;els.convert.textContent='GIFを作成して保存'}};
window.addEventListener('beforeunload',()=>frames.forEach(f=>URL.revokeObjectURL(f.url)));render();
</script>
</body>
</html>
