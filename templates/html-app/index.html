<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アプリのひな形</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#161616;background:#f5f2e9}*{box-sizing:border-box}body{margin:0}header{padding:24px;border-bottom:3px solid;background:#f8ed48}a{color:inherit}main{max-width:760px;margin:60px auto;padding:0 24px}h1{font-size:36px;letter-spacing:-.05em}section{padding:25px;border:3px solid;box-shadow:7px 7px #161616;background:white;margin-top:35px}h2{font-size:18px}p,li{font-size:13px;line-height:2}li{margin:9px 0}a:focus-visible{outline:4px solid #6046d7;outline-offset:4px}code{overflow-wrap:anywhere}</style></head><body><header><a href="../../index.html">← ホームへ</a></header><main><p>START SOMETHING USEFUL ↗</p><h1>次の道具を、ここから。</h1><p>これは新しいHTMLアプリのひな形です。まだ業務機能はありません。</p><section><h2>アプリを追加する流れ</h2><ol><li>このフォルダを<code>apps/&lt;機能名&gt;/</code>にコピーする。</li><li>タイトルと画面を変えて、機能を実装する。</li><li>資料を<code>docs/&lt;機能名&gt;/</code>にまとめる。</li><li><code>apps/registry.js</code>へ登録する。</li></ol></section></main></body></html>
